# teum 설정 파일 (값은 개발용 영상으로만 조정한다)

camera:
  bonnet_ratio: 0.85        # 화면 위에서부터 이 비율까지만 사용 (아래는 본넷이라 제외)
  center_x_ratio: 0.5       # 내 차 정면의 x 위치 (화면 폭 대비, 화면 아래 높이 기준). 치우침 계산에 사용
  vanishing_x_ratio: 0.5    # 소실점 x 위치 (화면 폭 대비, 카메라가 바라보는 방향). 관심 영역·좌우 구분에 사용

# ---------- 차선 인식 (장혜민) ----------
lane:
  roi_top_ratio: 0.6        # 차선을 찾기 시작할 높이 (화면 위에서 비율, 대략 지평선 바로 아래)
  roi_top_half_width_ratio: 0.1   # 관심 영역 윗변의 반폭 (화면 폭 대비, 정면 기준 좌우)
  canny_low: 50             # 윤곽선 검출 하한 (밝기 변화가 이보다 작으면 무시)
  canny_high: 150           # 윤곽선 검출 상한 (이보다 크면 확실한 윤곽선)
  hough_threshold: 30       # 직선으로 인정할 최소 투표 수
  hough_min_len_ratio: 0.03 # 직선으로 인정할 최소 길이 (화면 폭 대비)
  hough_max_gap_ratio: 0.03 # 같은 직선으로 이을 최대 끊김 (화면 폭 대비, 점선 차선 대응)
  min_abs_slope: 0.4        # 이보다 눕힌 선(|dy/dx| 작음)은 차선이 아니라고 봄 (그림자·가드레일 제거)
  cluster_px_ratio: 0.05    # 화면 아래 끝 x가 이 간격(화면 폭 대비) 이내인 선분은 같은 선으로 묶음 (점선 조각 묶기, 이웃 차선과는 분리)
  paint_white_contrast_min: 50  # 흰 칠로 볼 밝기 차이 (회색 0~255, 관심 영역 도로 밝기 중앙값보다 이만큼 밝아야. 연석·보도블록은 보통 이보다 덜 밝음 [추정])
  yellow_h_min: 15          # 노란 칠 색상 범위 하한 (OpenCV HSV 색상 0~180, 노랑 ≈ 30)
  yellow_h_max: 35          # 노란 칠 색상 범위 상한
  yellow_s_min: 80          # 노란 칠 최소 채도 (0~255, 회색·흰색과 구분)
  paint_side_px_ratio: 0.01 # 칠 마스크를 이만큼 넓혀 '칠 근처'로 봄 (화면 폭 대비, 640px에서 약 6px. Canny 선분은 칠 가장자리에 생김)
  paint_sample_points: 5    # 선분마다 칠을 확인할 점 개수 (많을수록 정확하지만 느림)
  paint_min_fraction: 0.6   # 선분 위 점 중 이 비율 이상이 칠 근처여야 차선 후보 (점선 끝·그림자 일부 허용)
  smooth_window_s: 0.5      # 차선 위치를 평균 낼 최근 시간 (초, 떨림 줄이기)
  hold_s: 0.3               # 차선을 놓쳐도 직전 값을 유지할 시간 (초, 점선 빈 구간 대응)
  width_window_s: 1.0       # 차선 폭(좌우 x 차이) 중앙값을 낼 최근 시간 (초, 폭은 천천히 변하니 길게 봐도 됨)
  estimate_max_s: 1.0       # 두 선을 마지막으로 함께 본 뒤 폭으로 반대쪽을 추정해도 되는 시간 (초, 차로 변경 중 선을 밟는 시간보다 넉넉히)
  lane_change_match_ratio: 0.15  # 새 왼쪽(오른쪽) 선이 직전 오른쪽(왼쪽) 선과 차선 폭의 이 비율 이내면 같은 선이 넘어온 것 (한 프레임 이동량보다 크고 차선 폭보다 훨씬 작게)
  lane_change_cooldown_s: 1.0    # 차로 변경을 감지한 뒤 다시 감지하지 않는 시간 (초, 같은 변경을 여러 번 세지 않게)

# ---------- 카메라 보정 도구 (tools/calibrate_camera.py, 장혜민) ----------
calibration:
  min_points: 30            # 추천값을 내기 위한 최소 소실점 개수 (24fps 기준 약 1.3초 분량, 이보다 적으면 우연일 수 있음)
  horizon_margin_ratio: 0.03 # 소실점보다 이만큼 아래부터 관심 영역 시작 (화면 높이 대비, 소실점 근처는 차선이 뭉개져서)
  wide_roi_top_ratio: 0.35  # --wide-roi: 처음 보는 카메라라 관심 영역 윗변을 넉넉히 위로 (화면 높이 대비)
  wide_bonnet_ratio: 1.0    # --wide-roi: 본넷 위치를 모르니 화면 맨 아래까지 사용
  wide_roi_top_half_width_ratio: 0.3 # --wide-roi: 소실점 위치를 모르니 윗변을 넓게 (화면 폭 대비 반폭)

# ---------- 앞차 정하기 (장혜민) ----------
front_car:
  default_lane_half_width_ratio: 0.35  # 차선을 못 찾을 때 쓸 기본 차선의 아래쪽 반폭 (화면 폭 대비. 개발용 highway 영상 차선 폭 289/406px ≈ 0.71의 절반 [추정])
  switch_hold_s: 0.3        # 다른 차가 이 시간(초) 이상 계속 1등이어야 앞차를 바꿈 (경계에 걸친 차 때문에 앞차가 깜빡이는 것 방지. 시내 영상에서 반복 바뀜 대부분이 0.5초 이내)
  lost_hold_s: 0.3          # 앞차가 탐지에서 사라져도 이 시간(초)은 마지막 박스로 유지 (가림·탐지 누락 몇 프레임 대응, 트래커 hold_s와 같은 값)

# ---------- 끼어들기 (장혜민, 출력 이름은 임시: 경고 판단 담당과 합의 필요) ----------
cut_in:
  confirm_s: 0.15          # 내 차선 안에 들어온 상태가 이 시간(초) 이어져야 끼어들기 확정 (선 위 박스 흔들림 몇 프레임 무시. 초기값, 개발용 영상으로 조정)
  near_y_ratio: 0.7        # 앞차가 없을 때, 박스 아래가 화면 높이의 이 비율보다 아래면 '가까움' (초기값 [추정], 보닛 위치에 따라 다름)
  ignore_after_lane_change_s: 1.0  # 내 차로 변경 뒤 이 시간(초)은 판단 안 함 (내가 움직이면 옆 차가 경계를 넘어 보임. 차로 변경 감지 쿨다운과 같은 값)
  edge_margin_ratio: 0.01  # 박스 x1 또는 x2가 화면 좌우 끝에서 이 비율(화면 폭 대비, 640px에서 6.4px) 안이면 잘린 박스로 보고 끼어들기 확정 안 함 (시내 영상 옆을 지나는 트럭 오탐. 초기값)

# ---------- 차량 탐지 YOLO (장혜민) ----------
detect:
  weights_path: weights/yolo11s.pt  # YOLO 가중치 (backend 기준, COCO 사전학습 small. *.pt는 커밋 금지. 2026-11-16 yolo11n·yolo26n·yolo11s 비교에서 주행 중 오토바이 탐지가 가장 나아서 교체)
  score_min: 0.25           # 이보다 확신도가 낮은 박스는 버림 (ultralytics 기본값에서 시작, 개발용 영상으로만 조정)
  score_min_by_class:       # 클래스별 확신도 하한 (없는 클래스는 score_min). 작게 찍혀 확신도가 낮게 나오는 오토바이만 따로
    motorcycle: 0.15        # 2026-11-16 개발용 시내 영상 비교(0.25/0.20/0.15): 먼 오토바이 18%→38%, 고속도로 결과 변화 없음, 늘어난 박스 대부분 실제 이륜차(자전거 오검출 일부)
  iou: 0.7                 # 겹친 박스를 하나로 합치는 기준 (NMS, ultralytics 기본값)
  agnostic_nms: true        # 클래스가 달라도 겹친 박스를 합침 (SUV를 car·truck로 동시에 잡아 박스가 2개 되는 것 방지)
  imgsz: 640                # YOLO 입력 크기 (px, 학습 크기와 같게. 키우면 먼 차를 더 찾지만 느려짐)
  device: null              # null이면 자동(GPU 있으면 GPU), "cpu" 또는 0(첫 GPU)으로 고정 가능
  track: true               # 추적으로 차마다 track_id 부여 (TTC는 같은 차의 박스 폭 기록이 필요)
  tracker: bytetrack.yaml   # 추적기 설정 (SPEC: ByteTrack, ultralytics 내장 파일)
  class_vote_window_s: 1.0 # 같은 차(track_id)의 클래스를 이 시간(초) 판정의 다수결로 고정 (SUV car/truck, 먼 오토바이 car/motorcycle 오락가락 방지. 초기값)

# ---------- 브레이크등 인식 (성아영) ----------
brake:
  weights_path: weights/brake_8s.pt  # 브레이크등 YOLO 가중치 (backend 기준, Colab 학습 YOLOv8s 입력 960 best.pt = brake_s960 48 epoch. 2026-11-18 팀 확정. *.pt는 커밋 금지)
  score_min: 0.3            # 이보다 확신도가 낮은 브레이크등 모델 박스는 버림
  on_score_min: 0.5         # "켜짐"은 이 확신도 이상일 때만 인정 (꺼짐을 켜짐으로 착각하는 오경보 31%를 줄이려고 높임)
  imgsz: 960                # 모델 입력 크기 (px, 학습 크기와 같게. v8s는 960으로 학습)
  device: null              # null이면 자동(GPU 있으면 GPU), "cpu" 또는 0(첫 GPU)
  match_iou_min: 0.3        # 앞차 박스와 이만큼(겹친 넓이 비율 0~1) 이상 겹쳐야 같은 차로 봄
  third_lamp_region_ratio: [0.30, 0.00, 0.70, 0.30]  # 보조 제동등 영역 [x1, y1, x2, y2] (차 박스 대비, 위쪽 가운데)
  side_lamp_y_ratio: [0.25, 0.65]  # 좌우 등 영역 세로 범위 [위, 아래] (차 박스 대비)
  side_lamp_w_ratio: 0.30   # 좌우 등 영역 가로 폭 (차 박스 대비, 양 끝에서)
  red_s_min: 100            # 빨강으로 셀 최소 채도 (HSV 0~255, 흰 차체·번호판 조명 제외)
  red_v_min: 150            # 빨강으로 셀 최소 밝기 (HSV 0~255, 켜진 등만)
  third_red_min: 0.015      # 보조 제동등 영역 빨강 비율이 이 이상이면 "보조 제동등 켜짐" (개발 데모: 브레이크 0.027 이상, 미등 0.001 이하 [추정])
  rise_ratio: 1.5           # 좌우 등 빨강 비율이 평소의 이 배 이상이면 "밝아짐"
  rise_abs_min: 0.02        # 그리고 평소보다 이만큼(비율) 이상 늘어야 "밝아짐" (어두운 장면의 작은 변화 무시)
  baseline_window_s: 1.0    # "평소 밝기"를 낼 최근 시간 (초)
  baseline_min_count: 3     # 평소 밝기를 믿으려면 필요한 최소 프레임 수 (처음 몇 프레임은 비교 안 함)
  vote_window_s: 0.2        # 최근 이 시간(초) 판단의 다수결로 최종 켜짐/꺼짐 (한두 프레임 오판 제거)

# ---------- 거리·TTC (app/risk/lead.py, 성아영) ----------
risk:
  hfov_deg: 70              # 카메라 수평 화각 (도). 초점거리(px) = 화면 절반 폭 ÷ tan(화각/2). 휴대폰 기본 카메라 약 65~75 [추정], 광각 블랙박스는 더 큼. 카메라마다 확인 필요
  real_width_m:             # 차종별 실제 폭 (m, 핀홀 거리 계산용. YOLO 클래스 이름 기준, 없는 클래스는 car 값)
    car: 1.8                # 승용차 (SPEC)
    motorcycle: 0.8         # 이륜차 (SPEC)
    bus: 2.5                # 대형차 법정 최대 폭 2.5m [추정: SPEC에 없어 추가]
    truck: 2.5              # 대형차 법정 최대 폭 2.5m [추정: SPEC에 없어 추가]
  ttc_window_s: 1.0         # TTC 직선 맞추기에 쓸 최근 시간 (초). SPEC 0.7초였으나 실시간(/live)은 약 4fps라 0.7초엔 기록이 3장뿐이어서 TTC가 안 나옴 → 1.0초 (2026-11-26 실시간 테스트)
  ttc_min_samples: 3        # 직선을 맞추려면 필요한 최소 기록 수 (5였으나 실시간 약 4fps에서 1초에 4장이라 3으로 낮춤. 30fps 기준 약 0.1초)
  ttc_max_s: 10.0           # 이보다 큰 TTC는 None (가까워지지 않음과 같게 봄. 경고 기준 3초보다 충분히 큼)
  ttc_warning_s: 3.0        # TTC가 이 값(초) 이하면 "경고" (SPEC, 경계값 포함)
  ttc_danger_s: 1.5         # TTC가 이 값(초) 이하면 "위험" (SPEC, 경계값 포함)
  safe_time_s: 2.0          # 안전거리 = 내 속도(km/h) ÷ 3.6 × 이 시간(초). 이보다 가까우면 "주의" (SPEC. 내 속도를 모르면 이 판단만 건너뜀)
  level_down_hold_s: 0.5    # 경고 단계를 내릴 때 이 시간(초) 동안 낮은 상태가 이어져야 내림 (올릴 때는 즉시. 깜빡임 방지, 초기값)
  lane_departure_ratio: 1.0 # |차선 치우침 비율|이 이 값 이상이면 차선 이탈 (1.0 = 선 위. 개발용 영상으로만 조정, 초기값)
  lane_departure_skip_after_change_s: 1.0  # 내 차로 변경을 감지한 뒤 이 시간(초)은 차선 이탈 판단 안 함 (의도한 차로 변경을 이탈로 보지 않게. 장혜민 cut_in.ignore_after_lane_change_s와 같은 값)
  lane_departure_level: caution  # 차선 이탈 경고 단계 (caution=주의, warning=경고. 경고 이상이어야 아찔한 순간으로 저장됨. SPEC에 단계 없음, 성아영 판단)

# ---------- 분석 파이프라인 (app/pipeline.py, 장혜민) ----------
pipeline:
  brake_every_n_frames: 1  # 브레이크등 모델을 이 프레임 수마다 한 번 실행 (1 = 매 프레임, 건너뛴 프레임은 직전 결과 재사용. 2026-11-17 GTX 1060 파이프라인 전체: 1 → 35~41ms, 3 → 28~33ms/프레임)

# ---------- 아찔한 순간 기록 (최상준) ----------
nearmiss:
  pre_s: 5.0                # 경고 시작 전 저장 시간 (초, 실시간은 링 버퍼로 보관)
  post_s: 5.0               # 경고 끝난 뒤 저장 시간 (초)
  merge_gap_s: 5.0          # 같은 주행·같은 종류 경고가 이 시간(초) 안에 또 오면 한 건으로 합친다
  clip_dir: outputs/clips   # 클립 저장 폴더 (레포 루트 기준, 커밋 안 함)
  upload_dir: outputs/uploads  # 올린 영상을 저장할 폴더 (레포 루트 기준, 커밋 안 함). 분석이 끝나도 지우지 않는다
